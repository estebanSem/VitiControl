services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: viticontrol
      POSTGRES_USER: viticontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viticontrol -d viticontrol"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    network_mode: "service:db"
    environment:
      DATABASE_URL: postgresql+psycopg://viticontrol:${POSTGRES_PASSWORD}@127.0.0.1:5432/viticontrol
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      UPLOAD_DIR: /app/uploads
      STATIC_DIR: /app/static
    volumes:
      - photos:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  photos:
